<script>
async function refreshSeats() {

    let res = await fetch("/seat_status");
    let data = await res.json();

    let select = document.getElementById("batchSelect");

    for (let i = 0; i < select.options.length; i++) {

        let opt = select.options[i];
        let batchId = opt.value;

        if (data[batchId]) {
            opt.setAttribute("data-male", data[batchId].male_left);
            opt.setAttribute("data-female", data[batchId].female_left);
        }
    }

    updateSeats();
}

// ✅ run every 5 seconds
setInterval(refreshSeats, 5000);
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  let pincode = document.getElementById("pincode");

  // ✅ ONLY ALLOW NUMBERS + AUTO TRIM LENGTH
  pincode.addEventListener("input", function () {

    // remove non-numbers
    this.value = this.value.replace(/[^0-9]/g, "");

    // limit to 6 digits
    if (this.value.length > 6) {
      this.value = this.value.slice(0, 6);
    }
  });


  // ✅ VALIDATE + FETCH
  pincode.addEventListener("blur", function () {

    let pin = this.value.trim();

    if (pin.length !== 6) {

      Swal.fire({
        icon: "error",
        title: "Invalid Pincode",
        text: "Please enter a valid 6-digit pincode"
      });

      // ✅ clear everything
      this.value = "";
      document.getElementById("state").value = "";
      document.getElementById("district").value = "";
      return;
    }

    // ✅ loading text
    document.getElementById("state").value = "Loading...";
    document.getElementById("district").value = "Loading...";

    fetch("https://api.postalpincode.in/pincode/" + pin)
      .then(res => res.json())
      .then(data => {

        if (data[0].Status === "Success") {

          let post = data[0].PostOffice[0];

          document.getElementById("state").value = post.State;
          document.getElementById("district").value = post.District;

        } else {

          Swal.fire({
            icon: "error",
            title: "Invalid Pincode",
            text: "No data found for this pincode"
          });

          // ✅ clear values
          document.getElementById("state").value = "";
          document.getElementById("district").value = "";
        }

      })
      .catch(() => {

        Swal.fire({
          icon: "error",
          title: "Error",
          text: "Unable to fetch location"
        });

        document.getElementById("state").value = "";
        document.getElementById("district").value = "";
      });

  });

});
</script>

<!-- DOB ---- Age---->
<script>
document.addEventListener("DOMContentLoaded", function () {

  let dobInput = document.getElementById("dob");
  let ageInput = document.getElementById("age");
  let dobText = document.getElementById("dobText");

  // ✅ INIT FLATPICKR
  flatpickr("#dob", {
    dateFormat: "d/m/Y",
    maxDate: "today",
    allowInput: true,
    yearSelectorType: "dropdown",
    monthSelectorType: "dropdown",

    onChange: function (selectedDates, dateStr) {

      if (!dateStr) return;

      // ✅ SPLIT DD/MM/YYYY
      let parts = dateStr.split("/");
      let day = parseInt(parts[0]);
      let month = parseInt(parts[1]) - 1;
      let year = parseInt(parts[2]);

      let dob = new Date(year, month, day);
      let today = new Date();

      // ✅ AGE CALCULATION
      let age = today.getFullYear() - dob.getFullYear();

      let m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
        age--;
      }

      // ✅ DISPLAY DOB (already formatted)
      dobText.innerText = "Selected: " + dateStr;

      // ✅ DISPLAY AGE
      ageInput.value = age + " Yrs";

    }
  });

});
</script>
