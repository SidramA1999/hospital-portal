<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<!-- Favicon -->
<link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Poppins', sans-serif;
  background: linear-gradient(135deg, #e9f5ec, #f4f8f4);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

/* LOGIN CARD */
.login-box {
  background:white;
  padding:35px;
  width:340px;
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,0.12);
  text-align:center;
  animation: fadeIn 0.8s ease;
}

/* LOGO */
.logo {
  width:60px;
  margin-bottom:10px;
}

/* TITLE */
.login-box h2 {
  font-family:'Playfair Display', serif;
  color:#2d6a4f;
  margin-bottom:5px;
}

.subtitle {
  font-size:13px;
  color:#888;
  margin-bottom:20px;
}

/* INPUTS */
.input-group {
  position:relative;
}

input {
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#f9f9f9;
  transition:0.3s;
}

/* Focus effect */
input:focus {
  outline:none;
  border-color:#40916c;
  box-shadow:0 0 5px rgba(64,145,108,0.2);
  background:white;
}

/* BUTTON */
.btn {
  width:100%;
  padding:12px;
  background:#40916c;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

.btn:hover {
  background:#2d6a4f;
  transform: translateY(-1px);
}

/* ERROR MESSAGE */
.error {
  color:#e63946;
  font-size:14px;
  margin-top:10px;
}

/* FOOTER */
.footer {
  margin-top:15px;
  font-size:12px;
  color:#aaa;
}

/* ANIMATION */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="login-box">

  <!-- Logo (optional) -->
  <!-- <png -->

  <h2>🌿 Admin Login</h2>
  <p class="subtitle">Amruta Aarogya Kendra Ayurved MultiSpeciality Hospital</p>

  <form method="POST">

    <div class="input-group">
      <input type="text" name="username" placeholder="Username" required>
    </div>

    <div class="input-group">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <!--- <button class="btn">Login</button> -->
    <button class="btn" onclick="this.innerText='Logging in...'">Login</button>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

  </form>

  <div class="footer">
    Secure Admin Access
  </div>

</div>

</body>
</html>
